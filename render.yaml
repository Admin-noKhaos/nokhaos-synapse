# Render Blueprint — provisions the Synapse worker as a free web service.
# After pushing this repo to GitHub, go to https://dashboard.render.com/blueprints
# and click "New Blueprint" pointing at this repo. Render reads this file and
# creates the service automatically.

services:
  - type: web
    name: synapse-worker
    runtime: node
    plan: free                    # bump to 'starter' for always-on
    region: frankfurt             # match Supabase eu-west-1
    rootDir: worker
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false               # set in Render dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: META_APP_SECRET
        sync: false
      - key: META_GRAPH_VERSION
        value: v21.0
      - key: CREDIT_MARKUP
        value: 2.0
      - key: POLL_INTERVAL_MS
        value: 2000
